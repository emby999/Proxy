rules:

  # ===== 红果/字节系广告拦截 =====
  - DOMAIN-KEYWORD,pangolin-sdk-toutiao,REJECT   # 穿山甲SDK（素材/上报）
  - DOMAIN-KEYWORD,pglstatp-toutiao,REJECT       # 穿山甲统计/广告图
  - DOMAIN-KEYWORD,ad.toutiao.com,REJECT         # 头条广告
  - DOMAIN-KEYWORD,adshare.toutiao.com,REJECT
  - DOMAIN-KEYWORD,sdfp.snssdk.com,REJECT        # 广告投放
  - DOMAIN-KEYWORD,bds.snssdk.com,REJECT
  - DOMAIN-KEYWORD,extlog.snssdk.com,REJECT      # 广告日志
  - DOMAIN-SUFFIX,pangle.cn,REJECT
  - DOMAIN-SUFFIX,pangle.io,REJECT

  # ===== 通用广告规则集（28万条，每天自动更新）=====
  - RULE-SET,ad-reject,REJECT
  
  # ===== QUIC 拦截 =====
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT

  # ===== 局域网 / 私有地址 =====
  - GEOIP,PRIVATE,DIRECT

  # ===== 隐私 / 追踪拦截 =====
  - DOMAIN-REGEX,\.log\.,REJECT
  - DOMAIN-KEYWORD,tracker,REJECT
  - DOMAIN-REGEX,^adservice\.google\.,REJECT
  - DOMAIN-SUFFIX,stun.l.google.com,REJECT
  - DOMAIN-KEYWORD,stun,REJECT
  
  # 广告拦截 - 使用 no-resolve 避免 DNS 查询

  # ===== 广告拦截 =====
  - GEOSITE,category-ads-all,REJECT
  - DOMAIN-KEYWORD,ads,REJECT
#  - DOMAIN-KEYWORD,ads.,REJECT

